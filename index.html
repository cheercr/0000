<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dizen Shop · รีวิวลูกค้า</title>
<link rel="icon" href="https://i.postimg.cc/QxcxS0Lz/IMG-8458.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700;900&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   โทนสี: ม่วงราตรี + น้ำเงินไพลิน + ทองคำ — Dizen Shop
   ============================================================ */
:root{
  --ink:#07041a;
  --ink-2:#0e0830;
  --violet:#7b2ff7;
  --violet-soft:#b98bff;
  --sapphire:#1b4dd8;
  --sapphire-soft:#5aa9ff;
  --gold:#f3c969;
  --gold-deep:#b8862f;
  --ivory:#f7f2e8;
  --muted:rgba(247,242,232,.62);
  --line:rgba(185,139,255,.22);
  --glass:rgba(22,12,58,.55);
  --radius-lg:28px;
  --radius-sm:14px;
  --shadow-deep:0 30px 80px -30px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--ink);
  color:var(--ivory);
  font-family:"IBM Plex Sans Thai","Segoe UI",system-ui,sans-serif;
  font-weight:300;
  line-height:1.7;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- พื้นหลังไล่สีเคลื่อนไหว (ออโรร่า) ---------- */
.aurora{position:fixed;inset:-25%;z-index:-3;filter:blur(90px);opacity:.85}
.aurora span{position:absolute;border-radius:50%;mix-blend-mode:screen}
.a1{width:52vw;height:52vw;left:-8%;top:2%;background:radial-gradient(circle,#7b2ff7,transparent 65%);animation:drift1 22s ease-in-out infinite}
.a2{width:46vw;height:46vw;right:-6%;top:12%;background:radial-gradient(circle,#1b4dd8,transparent 65%);animation:drift2 27s ease-in-out infinite}
.a3{width:40vw;height:40vw;left:28%;bottom:-6%;background:radial-gradient(circle,#b8862f,transparent 62%);animation:drift3 31s ease-in-out infinite}
@keyframes drift1{50%{transform:translate3d(14vw,10vh,0) scale(1.18)}}
@keyframes drift2{50%{transform:translate3d(-12vw,14vh,0) scale(1.12)}}
@keyframes drift3{50%{transform:translate3d(8vw,-12vh,0) scale(1.22)}}

.grid-bg{
  position:fixed;inset:0;z-index:-2;opacity:.16;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 72%);
}
#dust{position:fixed;inset:0;z-index:-1;pointer-events:none}

.wrap{width:min(1120px,92vw);margin:0 auto;padding:clamp(28px,5vw,64px) 0 90px}

/* ---------- แถบหัวเว็บ ---------- */
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-slot{
  position:relative;width:76px;height:76px;flex:none;border-radius:22px;
  background:linear-gradient(145deg,rgba(123,47,247,.35),rgba(27,77,216,.35));
  border:1px solid rgba(243,201,105,.45);
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 14px 40px -14px rgba(123,47,247,.9);
}
.logo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.logo-slot::after{
  content:"";position:absolute;inset:-40%;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  transform:translateX(-120%);animation:sheen 5.5s ease-in-out infinite;
}
@keyframes sheen{0%,72%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}

.brand{flex:1;min-width:220px}
.brand h1{
  margin:0;font-family:"Noto Serif Thai",serif;font-weight:900;
  font-size:clamp(28px,4.6vw,46px);letter-spacing:-.01em;line-height:1.15;
  background:linear-gradient(100deg,#fff 0%,var(--gold) 28%,#fff6dc 42%,var(--violet-soft) 66%,var(--sapphire-soft) 100%);
  background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:flow 9s linear infinite;
}
@keyframes flow{to{background-position:280% 0}}
.brand p{margin:4px 0 0;color:var(--muted);font-size:15px}

.live-chip{
  display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;
  border:1px solid rgba(90,169,255,.4);background:rgba(27,77,216,.16);
  font-size:13px;color:var(--sapphire-soft);white-space:nowrap;
}
.pulse{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.75);animation:blink 1.6s ease-out infinite}
.pulse.off{background:#f59e0b}
@keyframes blink{70%{box-shadow:0 0 0 12px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

/* ---------- การ์ดกระจก ---------- */
.card{
  position:relative;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-deep);
}
.card.beam::before{
  content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;z-index:-1;
  background:conic-gradient(from var(--ang),transparent 0 42%,var(--gold) 50%,var(--violet) 60%,var(--sapphire-soft) 70%,transparent 78% 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 6s linear infinite;
}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}

/* ---------- ฮีโร่: วงแหวนคะแนน ---------- */
.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,4vw,52px);align-items:center;margin-top:34px;padding:clamp(26px,3.6vw,46px)}
.dial{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:300px;margin:0 auto;width:100%}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:rgba(247,242,232,.09);stroke-width:9}
.dial .prog{fill:none;stroke:url(#goldGrad);stroke-width:9;stroke-linecap:round;
  filter:drop-shadow(0 0 10px rgba(243,201,105,.75));transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.score{text-align:center;position:relative}
.score b{
  display:block;font-family:"Noto Serif Thai",serif;font-weight:900;
  font-size:clamp(52px,9vw,76px);line-height:1;color:var(--gold);
  text-shadow:0 0 26px rgba(243,201,105,.55);
}
.score small{display:block;color:var(--muted);font-size:14px;margin-top:8px}
.score .rowstar{font-size:20px;letter-spacing:4px;color:var(--gold);margin-top:6px}

.bars{display:grid;gap:12px}
.bars .row{display:grid;grid-template-columns:54px 1fr 58px;align-items:center;gap:14px;font-size:14px}
.bars .lab{color:var(--gold);white-space:nowrap}
.bars .meter{height:12px;border-radius:99px;background:rgba(247,242,232,.08);overflow:hidden;position:relative}
.bars .fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sapphire),var(--violet) 55%,var(--gold));
  background-size:200% 100%;animation:flow 4.5s linear infinite;
  box-shadow:0 0 14px rgba(185,139,255,.6);
  transition:width 1s cubic-bezier(.2,.8,.2,1);
}
.bars .num{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- ฟอร์มให้ดาว ---------- */
.give{margin-top:26px;padding:clamp(24px,3.4vw,42px)}
.give h2,.feed h2{margin:0 0 6px;font-family:"Noto Serif Thai",serif;font-weight:700;font-size:clamp(20px,2.6vw,26px)}
.give .sub{color:var(--muted);font-size:14px;margin:0 0 22px}

.stars{display:flex;gap:clamp(6px,2vw,16px);justify-content:center;margin:8px 0 6px}
.star{
  width:clamp(46px,10vw,68px);height:clamp(46px,10vw,68px);border:0;background:none;padding:0;cursor:pointer;
  color:rgba(247,242,232,.2);transition:transform .25s cubic-bezier(.2,.9,.3,1.6),color .25s,filter .25s;
}
.star svg{width:100%;height:100%;display:block}
.star:hover{transform:scale(1.18) rotate(-6deg)}
.star.on{color:var(--gold);filter:drop-shadow(0 0 14px rgba(243,201,105,.9))}
.star.on.beat{animation:pop .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{40%{transform:scale(1.42) rotate(8deg)}}
.star:focus-visible{outline:2px solid var(--sapphire-soft);outline-offset:4px;border-radius:10px}
.star-label{text-align:center;color:var(--gold);min-height:26px;font-size:15px;letter-spacing:.02em}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
input,textarea{
  width:100%;padding:14px 16px;border-radius:var(--radius-sm);color:var(--ivory);
  background:rgba(7,4,26,.55);border:1px solid var(--line);
  font-family:inherit;font-size:15px;font-weight:300;transition:border-color .3s,box-shadow .3s;
}
textarea{grid-column:1/-1;min-height:104px;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(247,242,232,.35)}
input:focus,textarea:focus{outline:none;border-color:rgba(243,201,105,.6);box-shadow:0 0 0 4px rgba(123,47,247,.18)}

.send{
  margin-top:18px;width:100%;padding:16px 26px;border:0;border-radius:var(--radius-sm);cursor:pointer;
  font-family:"Noto Serif Thai",serif;font-weight:700;font-size:17px;color:#1a0f00;
  background:linear-gradient(100deg,var(--gold-deep),var(--gold) 30%,#fff3cf 50%,var(--gold) 70%,var(--gold-deep));
  background-size:220% 100%;animation:flow 6s linear infinite;
  box-shadow:0 18px 44px -16px rgba(243,201,105,.85);
  transition:transform .25s,box-shadow .25s,opacity .25s;
}
.send:hover{transform:translateY(-2px);box-shadow:0 24px 54px -16px rgba(243,201,105,1)}
.send:active{transform:translateY(1px)}
.send:disabled{opacity:.45;cursor:not-allowed;animation:none;transform:none}

/* ---------- ฟีดรีวิว ---------- */
.feed{margin-top:26px;padding:clamp(24px,3.4vw,42px)}
.feed-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-family:inherit;
  background:rgba(247,242,232,.05);border:1px solid var(--line);color:var(--muted);transition:.25s;
}
.chip:hover{color:var(--ivory);border-color:rgba(243,201,105,.5)}
.chip[aria-pressed="true"]{background:linear-gradient(100deg,rgba(123,47,247,.5),rgba(27,77,216,.5));color:#fff;border-color:rgba(243,201,105,.55)}

.list{display:grid;gap:14px}
.item{
  display:grid;grid-template-columns:48px 1fr;gap:14px;padding:18px;border-radius:20px;
  background:rgba(7,4,26,.45);border:1px solid rgba(185,139,255,.14);
}
.item.fresh{animation:land .7s cubic-bezier(.2,.9,.3,1.3);border-color:rgba(243,201,105,.55);box-shadow:0 0 32px -6px rgba(243,201,105,.4)}
@keyframes land{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.avatar{
  width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  font-family:"Noto Serif Thai",serif;font-weight:700;font-size:19px;color:#fff;
  background:linear-gradient(145deg,var(--violet),var(--sapphire));
  border:1px solid rgba(243,201,105,.4);
}
.item .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item .who strong{font-weight:600;font-size:15px}
.item .who .s{color:var(--gold);letter-spacing:2px;font-size:14px}
.item .when{color:rgba(247,242,232,.4);font-size:12px}
.item p{margin:6px 0 0;font-size:15px;color:rgba(247,242,232,.82)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:15px}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);z-index:60;
  padding:14px 24px;border-radius:999px;font-size:15px;color:#1a0f00;
  background:linear-gradient(100deg,var(--gold),#fff3cf,var(--gold));
  box-shadow:0 20px 50px -14px rgba(243,201,105,.9);transition:transform .5s cubic-bezier(.2,.9,.3,1.4);
}
.toast.show{transform:translate(-50%,0)}
#pop{position:fixed;inset:0;pointer-events:none;z-index:70}

footer{text-align:center;color:rgba(247,242,232,.35);font-size:13px;margin-top:38px}

/* ---------- แบนเนอร์ตั้งค่า (ขึ้นเฉพาะตอนยังไม่เชื่อม Firebase) ---------- */
.setup{
  margin-top:26px;padding:18px 22px;border-radius:18px;font-size:14px;line-height:1.8;
  background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#ffd98a;
}
.setup code{background:rgba(0,0,0,.35);padding:1px 7px;border-radius:6px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;text-align:center}
  .bars .row{grid-template-columns:48px 1fr 46px}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="grid-bg"></div>
<canvas id="dust"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5aa9ff"/><stop offset="45%" stop-color="#b98bff"/><stop offset="100%" stop-color="#f3c969"/>
    </linearGradient>
  </defs>
</svg>

<div class="wrap">

  <header class="topbar">
    <div class="logo-slot">
      <img src="https://i.postimg.cc/QxcxS0Lz/IMG-8458.jpg" alt="โลโก้ Dizen Shop">
    </div>
    <div class="brand">
      <h1>Dizen Shop</h1>
      <p>รีวิวจากลูกค้าจริง อัปเดตสดตลอด</p>
    </div>
    <span class="live-chip"><span class="pulse" id="pulseDot"></span><span id="liveTxt">กำลังเชื่อมต่อ…</span></span>
  </header>

  <div class="setup" id="setupNote" hidden></div>

  <section class="card beam hero">
    <div class="dial">
      <svg viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="88"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="88" stroke-dasharray="0 553"/>
      </svg>
      <div class="score">
        <b id="avg">0.0</b>
        <div class="rowstar" id="avgStars">☆☆☆☆☆</div>
        <small id="total">ยังไม่มีรีวิว</small>
      </div>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card give">
    <h2>ให้ดาว Dizen Shop</h2>
    <p class="sub">แตะดาวที่คุณอยากให้ แล้วกดส่ง คะแนนจะเด้งขึ้นหน้าเว็บทันทีให้ทุกคนเห็น</p>
    <div class="stars" id="stars"></div>
    <div class="star-label" id="starLabel">ยังไม่ได้เลือกดาว</div>
    <div class="fields">
      <input id="name" maxlength="40" placeholder="ชื่อของคุณ (ไม่ใส่ก็ได้)">
      <input id="contact" maxlength="40" placeholder="สินค้าที่ใช้บริการ">
      <textarea id="text" maxlength="400" placeholder="เล่าให้ฟังหน่อยว่าร้านบริการเป็นยังไง"></textarea>
    </div>
    <button class="send" id="send" disabled>เลือกดาวก่อนส่งรีวิว</button>
  </section>

  <section class="card feed">
    <div class="feed-head">
      <div>
        <h2>เสียงจากลูกค้า</h2>
        <p class="sub" style="margin:0" id="feedCount">0 รีวิว</p>
      </div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <footer>© Dizen Shop · รีวิวทั้งหมดอัปเดตแบบเรียลไทม์</footer>
</div>

<div class="toast" id="toast"></div>
<canvas id="pop"></canvas>

<script type="module">
/* ============================================================
   1) FIREBASE — วางค่าโปรเจกต์ของคุณตรงนี้ ระบบจะต่อให้อัตโนมัติ
   ดูวิธีหาค่านี้ที่คำอธิบายท้ายข้อความ (ใช้เวลา ~2 นาที ฟรี)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzip4A52vfWnKrIi0JE2CImISmYYejS6Q",
  authDomain: "dizen-shop.firebaseapp.com",
  databaseURL: "https://dizen-shop-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dizen-shop",
};

const KEY = "dizen.reviews.v1";
let reviews = [];

/* โหมดสำรอง: ถ้ายังไม่กรอก Firebase จะเก็บในเครื่อง + ซิงก์ข้ามแท็บ
   เพื่อให้ทดสอบหน้าตาได้ทันทีโดยไม่ต้องตั้งค่าอะไรก่อน */
const LocalStore = {
  ch: ("BroadcastChannel" in window) ? new BroadcastChannel("dizen-reviews") : null,
  read(){ try{ return JSON.parse(localStorage.getItem(KEY)) || [] }catch(e){ return [] } },
  start(cb){
    cb(this.read());
    if(this.ch) this.ch.onmessage = () => cb(this.read());
    addEventListener("storage", e => { if(e.key === KEY) cb(this.read()); });
  },
  add(r){
    const all = this.read(); all.unshift(r);
    localStorage.setItem(KEY, JSON.stringify(all.slice(0,500)));
    if(this.ch) this.ch.postMessage(1);
    this.start.cb && this.start.cb(this.read());
  }
};

let store = LocalStore;
const isConfigured = Object.values(FIREBASE_CONFIG).every(v => v && !v.startsWith("วาง"));

async function boot(){
  const dot = document.getElementById("pulseDot"), liveTxt = document.getElementById("liveTxt");
  const note = document.getElementById("setupNote");

  if(isConfigured){
    try{
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getDatabase, ref, push, onValue, query, limitToLast } =
        await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
      const app = initializeApp(FIREBASE_CONFIG);
      const db = getDatabase(app);
      const node = ref(db, "reviews");
      store = {
        start(cb){ onValue(query(node, limitToLast(500)), snap => {
          const out = []; snap.forEach(c => out.push(c.val())); cb(out.reverse());
        }, err => { console.error(err); dot.classList.add("off"); liveTxt.textContent = "เชื่อมต่อไม่สำเร็จ"; }); },
        add(r){ push(node, r); }
      };
      liveTxt.textContent = "เรียลไทม์ · ทุกเครื่องเห็นพร้อมกัน";
      note.hidden = true;
    }catch(e){
      console.warn("ต่อ Firebase ไม่สำเร็จ ใช้โหมดในเครื่องแทน", e);
      dot.classList.add("off"); liveTxt.textContent = "โหมดในเครื่อง (Firebase ล้มเหลว)";
      showSetupNote();
    }
  } else {
    dot.classList.add("off"); liveTxt.textContent = "โหมดทดสอบ (ยังไม่เชื่อม Firebase)";
    showSetupNote();
  }
  store.start(render);

/* ============================================================
   2) ดาว
   ============================================================ */
const STAR_PATH = "M12 2.1l2.95 6.28 6.55.95-4.75 4.72 1.13 6.85L12 17.7l-5.88 3.2 1.13-6.85L2.5 9.33l6.55-.95L12 2.1z";
const WORDS = ["","แย่ ต้องปรับปรุง","พอใช้ได้","ดี ใช้ได้เลย","ดีมาก ประทับใจ","ดีที่สุด แนะนำเลย"];
let picked = 0;

const starsBox = document.getElementById("stars");
for(let i=1;i<=5;i++){
  const b = document.createElement("button");
  b.className = "star"; b.type = "button"; b.dataset.v = i;
  b.setAttribute("aria-label", i + " ดาว");
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${STAR_PATH}"/></svg>`;
  b.addEventListener("mouseenter", () => paint(i));
  b.addEventListener("mouseleave", () => paint(picked));
  b.addEventListener("click", () => {
    picked = i; paint(i);
    b.classList.add("beat"); setTimeout(()=>b.classList.remove("beat"), 460);
    const send = document.getElementById("send");
    send.disabled = false; send.textContent = "ส่งรีวิว " + i + " ดาว";
  });
  starsBox.appendChild(b);
}
function paint(n){
  [...starsBox.children].forEach((el,idx) => el.classList.toggle("on", idx < n));
  document.getElementById("starLabel").textContent = n ? WORDS[n] : "ยังไม่ได้เลือกดาว";
}

/* ============================================================
   3) ส่งรีวิว
   ============================================================ */
document.getElementById("send").addEventListener("click", () => {
  if(!picked) return;
  const name = document.getElementById("name").value.trim() || "ลูกค้า";
  store.add({
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    stars: picked,
    name: name.slice(0,40),
    note: document.getElementById("contact").value.trim().slice(0,40),
    text: document.getElementById("text").value.trim().slice(0,400),
    at: Date.now()
  });
  confetti();
  toast("ส่งรีวิว " + picked + " ดาวแล้ว ขอบคุณมาก");
  picked = 0; paint(0);
  document.getElementById("text").value = "";
  const send = document.getElementById("send");
  send.disabled = true; send.textContent = "เลือกดาวก่อนส่งรีวิว";
});

/* ============================================================
   4) แสดงผล
   ============================================================ */
let filter = 0, known = new Set(), first = true;

const filters = document.getElementById("filters");
[["ทั้งหมด",0],["5 ดาว",5],["4 ดาว",4],["3 ดาว",3],["1–2 ดาว",1]].forEach(([t,v]) => {
  const c = document.createElement("button");
  c.className = "chip"; c.type = "button"; c.textContent = t;
  c.setAttribute("aria-pressed", v === 0);
  c.onclick = () => {
    filter = v;
    [...filters.children].forEach(x => x.setAttribute("aria-pressed","false"));
    c.setAttribute("aria-pressed","true");
    render(reviews);
  };
  filters.appendChild(c);
});

const barsBox = document.getElementById("bars");
for(let s=5;s>=1;s--){
  barsBox.insertAdjacentHTML("beforeend",
    `<div class="row"><span class="lab">${s} ดาว</span><span class="meter"><span class="fill" data-s="${s}"></span></span><span class="num" data-n="${s}">0</span></div>`);
}

function render(data){
  reviews = data || [];
  const n = reviews.length;
  const sum = reviews.reduce((a,r) => a + (+r.stars || 0), 0);
  const avg = n ? sum / n : 0;

  animateNum(document.getElementById("avg"), avg);
  document.getElementById("avgStars").textContent =
    "★".repeat(Math.round(avg)) + "☆".repeat(5 - Math.round(avg));
  document.getElementById("total").textContent = n ? "จาก " + n + " รีวิว" : "ยังไม่มีรีวิว มาเป็นคนแรกกันเลย";
  document.getElementById("feedCount").textContent = n + " รีวิว";

  const C = 2 * Math.PI * 88;
  document.getElementById("prog").setAttribute("stroke-dasharray", (C * avg / 5) + " " + C);

  for(let s=1;s<=5;s++){
    const c = reviews.filter(r => +r.stars === s).length;
    barsBox.querySelector(`.fill[data-s="${s}"]`).style.width = (n ? c/n*100 : 0) + "%";
    barsBox.querySelector(`.num[data-n="${s}"]`).textContent = c;
  }

  const list = document.getElementById("list");
  const shown = reviews.filter(r => filter === 0 ? true : filter === 1 ? +r.stars <= 2 : +r.stars === filter);
  list.innerHTML = "";
  if(!shown.length){
    list.innerHTML = `<div class="empty">ยังไม่มีรีวิวในหมวดนี้</div>`;
  } else {
    shown.slice(0,60).forEach(r => {
      const fresh = !first && !known.has(r.id);
      const el = document.createElement("article");
      el.className = "item" + (fresh ? " fresh" : "");
      el.innerHTML =
        `<div class="avatar">${esc((r.name||"ล")[0])}</div>
         <div>
           <div class="who">
             <strong>${esc(r.name||"ลูกค้า")}</strong>
             <span class="s">${"★".repeat(+r.stars)}${"☆".repeat(5-+r.stars)}</span>
             ${r.note ? `<span class="when">· ${esc(r.note)}</span>` : ""}
             <span class="when">${ago(r.at)}</span>
           </div>
           ${r.text ? `<p>${esc(r.text)}</p>` : ""}
         </div>`;
      list.appendChild(el);
    });
  }
  reviews.forEach(r => known.add(r.id));
  first = false;
}

function esc(s){ return String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }
function ago(t){
  const d = (Date.now() - (t||0)) / 1000;
  if(d < 60) return "เมื่อครู่";
  if(d < 3600) return Math.floor(d/60) + " นาทีที่แล้ว";
  if(d < 86400) return Math.floor(d/3600) + " ชั่วโมงที่แล้ว";
  return Math.floor(d/86400) + " วันที่แล้ว";
}
function animateNum(el, to){
  const from = parseFloat(el.textContent) || 0, t0 = performance.now();
  (function step(t){
    const k = Math.min(1, (t - t0) / 700);
    el.textContent = (from + (to - from) * (1 - Math.pow(1-k,3))).toFixed(1);
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ============================================================
   5) ทอสต์ + คอนเฟตตีทอง + ฝุ่นดาว
   ============================================================ */
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

const pop = document.getElementById("pop"), pctx = pop.getContext("2d");
let bits = [];
function confetti(){
  const cols = ["#f3c969","#b98bff","#5aa9ff","#fff3cf","#7b2ff7"];
  for(let i=0;i<110;i++){
    bits.push({
      x: innerWidth/2, y: innerHeight*0.62,
      vx: (Math.random()-.5)*13, vy: -Math.random()*15-4,
      s: Math.random()*7+3, c: cols[i%cols.length],
      r: Math.random()*6, vr: (Math.random()-.5)*.35, life: 1
    });
  }
}
const dust = document.getElementById("dust"), dctx = dust.getContext("2d");
let motes = [];
function sizeAll(){
  [pop,dust].forEach(c => { c.width = innerWidth; c.height = innerHeight; });
  motes = Array.from({length: Math.min(90, Math.floor(innerWidth/16))}, () => ({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: Math.random()*1.7+.4, a: Math.random()*.6+.15,
    vy: -(Math.random()*.25+.05), tw: Math.random()*Math.PI*2
  }));
}
addEventListener("resize", sizeAll); sizeAll();

(function loop(){
  dctx.clearRect(0,0,dust.width,dust.height);
  motes.forEach(m => {
    m.y += m.vy; m.tw += .04;
    if(m.y < -4){ m.y = dust.height + 4; m.x = Math.random()*dust.width; }
    dctx.globalAlpha = m.a * (0.5 + 0.5*Math.sin(m.tw));
    dctx.fillStyle = m.r > 1.2 ? "#f3c969" : "#b98bff";
    dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, 7); dctx.fill();
  });
  dctx.globalAlpha = 1;

  pctx.clearRect(0,0,pop.width,pop.height);
  bits = bits.filter(b => b.life > 0);
  bits.forEach(b => {
    b.vy += .42; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .009;
    pctx.save(); pctx.translate(b.x,b.y); pctx.rotate(b.r);
    pctx.globalAlpha = Math.max(0,b.life); pctx.fillStyle = b.c;
    pctx.fillRect(-b.s/2,-b.s/2,b.s,b.s*.6); pctx.restore();
  });
  requestAnimationFrame(loop);
})();

boot();
</script>
</body>
